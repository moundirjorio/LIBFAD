{% extends "base.html" %}
{% block public_content %}
<div class="auth-card fade-in" style="max-width:32rem;">
  <div class="text-center mb-7">
    <div class="brand-mark mx-auto mb-4"><i data-lucide="sparkles"></i></div>
    <h1 class="text-2xl font-extrabold tracking-tight">Créer un compte LIBFAD</h1>
    <p class="muted text-sm mt-1">Commencez à automatiser votre facturation</p>
  </div>
  {% if error %}
  <div class="mb-4 p-3 rounded-xl bg-red-50 text-red-700 text-sm border border-red-100 dark:bg-red-500/10 dark:border-red-500/20 dark:text-red-300">{{ error }}</div>
  {% endif %}
  <form method="post" action="/register" class="space-y-4">
    <div>
      <label class="label">Nom de l'entreprise</label>
      <input name="company_name" required class="input" placeholder="Acme SARL" />
    </div>
    <div>
      <label class="label">Votre nom complet</label>
      <input name="full_name" required class="input" placeholder="Jean Dupont" />
    </div>
    <div>
      <label class="label">Email</label>
      <input name="email" type="email" required class="input" placeholder="vous@entreprise.com" />
    </div>
    <div>
      <label class="label">Mot de passe</label>
      <input name="password" type="password" minlength="6" required class="input" placeholder="6 caractères minimum" />
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="label">Pays</label>
        <select name="country" class="select">
          <option value="FR">France</option>
          <option value="MA">Maroc</option>
        </select>
      </div>
      <div>
        <label class="label">Devise</label>
        <select name="currency" class="select">
          <option value="EUR">EUR</option>
          <option value="MAD">MAD</option>
          <option value="USD">USD</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-full">Créer mon compte</button>
  </form>
  <p class="text-center text-sm muted mt-6">
    Déjà un compte ? <a href="/login" class="text-brand-600 dark:text-brand-400 font-semibold hover:underline">Se connecter</a>
  </p>
</div>
{% endblock %}
